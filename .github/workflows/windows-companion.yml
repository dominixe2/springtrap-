name: Build Micro Helper Windows Companion

on:
  workflow_dispatch:
  push:
    branches: [micro-helper]
    paths:
      - "windows-companion/**"
      - ".github/workflows/windows-companion.yml"

permissions:
  contents: read

jobs:
  build-windows-companion:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python source
        working-directory: windows-companion
        run: |
          python -m py_compile companion.py tests/test_companion_security.py
          python -m unittest discover -s tests -v
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone executable
        working-directory: windows-companion
        run: pyinstaller --onefile --clean --name MicroHelperCompanion companion.py
      - name: Upload Windows Companion
        uses: actions/upload-artifact@v4
        with:
          name: micro-helper-windows-companion
          path: windows-companion/dist/MicroHelperCompanion.exe
          if-no-files-found: error
          retention-days: 30
