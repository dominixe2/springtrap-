name: Build Micro Helper Windows Companion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "windows-companion/**"
      - "cloud-relay/**"
      - ".github/workflows/windows-companion.yml"
  push:
    branches: [micro-helper]
    paths:
      - "windows-companion/**"
      - "cloud-relay/**"
      - ".github/workflows/windows-companion.yml"

permissions:
  contents: read

jobs:
  build-windows-companion:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate Python source
        working-directory: windows-companion
        run: |
          python -m py_compile companion.py tests/test_companion_security.py
          python -m unittest discover -s tests -v
      - name: Install Companion dependencies and PyInstaller
        run: |
          python -m pip install -r windows-companion/requirements.txt
          python -m pip install "pyinstaller>=6,<7"
      - name: Build standalone executable
        working-directory: windows-companion
        run: pyinstaller --onefile --clean --name MicroHelperCompanion companion.py
      - name: Upload Windows Companion
        uses: actions/upload-artifact@v7
        with:
          name: micro-helper-windows-companion
          path: windows-companion/dist/MicroHelperCompanion.exe
          if-no-files-found: error
          retention-days: 30
