name: Springtrap checks

on:
  schedule:
    - cron: '23 6 * * 1'
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python files
        run: python -m compileall -q app.py key_store.py brain tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
