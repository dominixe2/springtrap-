name: Micro Helper checks

on:
  push:
    branches: ["main", "micro-helper"]
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Set up Node.js for browser UI validation
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check embedded browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          html = Path("src/micro_helper/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.DOTALL)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          for index, script in enumerate(scripts):
              path = Path(f"/tmp/micro-helper-ui-{index}.js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          PY
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run tests
        run: pytest -q
