name: Micro Helper checks

on:
  push:
    branches: ["main", "micro-helper"]
  pull_request:
  workflow_dispatch:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run tests
        run: pytest -q
