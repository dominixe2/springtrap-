name: Deploy Micro Helper Cloudflare Relay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-helper-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validate worker syntax
        run: node --check cloudflare/worker.js
      - name: Install Wrangler
        run: npm install --global wrangler@4.160.1
      - name: Deploy Cloudflare Worker and Durable Object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret" && exit 1)
          wrangler deploy --config cloudflare/wrangler.toml
