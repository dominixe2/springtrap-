name: Micro Helper hosted source checks

on:
  push:
    branches: [micro-helper]
    paths:
      - "hosted-app/**"
      - "scripts/verify_hosted_app.py"
      - ".github/workflows/hosted-app-checks.yml"
  pull_request:
    paths:
      - "hosted-app/**"
      - "scripts/verify_hosted_app.py"
      - ".github/workflows/hosted-app-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate hosted source mirror
        run: python scripts/verify_hosted_app.py
